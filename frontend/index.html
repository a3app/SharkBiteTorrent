<!DOCTYPE html>
<!-- No writing suggestions or spellcheck anywhere: in WebView2 those are
     Microsoft Editor / text prediction, which send what you type to
     substrate.office.com outside the VPN (caught by cmd/leakcheck -app). -->
<html lang="en" writingsuggestions="false" spellcheck="false">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <!-- The window only ever shows the app itself: nothing from the internet
         (scripts, images, fonts, connections), so a future change can't make
         the web view contact anything outside the VPN. data: is for the
         phone-pairing QR code. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"/>
    <title>Shark BiteTorrent</title>
</head>
<body>
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
